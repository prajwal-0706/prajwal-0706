<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Prajwal Gadhave, founding engineer. I build backends, clusters and products that stay up.">
  <defs>
    <clipPath id="frame"><rect x="0" y="0" width="1200" height="420" rx="28"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="0" y="0" width="1200" height="420" fill="#070b18"/>
    <g filter="url(#blur)" opacity="0.85">
      <circle cx="180" cy="120" r="200" fill="#7c3aed">
        <animateTransform attributeName="transform" type="translate" values="0 0; 90 60; 0 0" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle cx="560" cy="420" r="220" fill="#0ea5e9">
        <animateTransform attributeName="transform" type="translate" values="0 0; -70 -50; 0 0" dur="17s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1020" cy="80" r="190" fill="#14b8a6">
        <animateTransform attributeName="transform" type="translate" values="0 0; -60 80; 0 0" dur="19s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1150" cy="400" r="170" fill="#f43f5e" opacity="0.7">
        <animateTransform attributeName="transform" type="translate" values="0 0; -80 -60; 0 0" dur="16s" repeatCount="indefinite"/>
      </circle>
    </g>
    <rect x="0" y="0" width="1200" height="420" fill="#070b18" opacity="0.35"/>
  </g>

  <g font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="80" y="118" font-size="16" letter-spacing="4" fill="#a5b4fc">FOUNDING ENGINEER · PUNE, INDIA</text>
    <text x="78" y="196" font-size="76" font-weight="800" letter-spacing="-2" fill="url(#name)">Prajwal Gadhave</text>
    <text x="80" y="246" font-size="23" fill="#e2e8f0" opacity="0.9">I build backends, clusters and products that stay up.</text>

    <g font-size="14" font-weight="600" fill="#e2e8f0">
      <rect x="80" y="286" width="112" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="136" y="308" text-anchor="middle">TypeScript</text>
      <rect x="204" y="286" width="90" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="249" y="308" text-anchor="middle">Node.js</text>
      <rect x="306" y="286" width="112" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="362" y="308" text-anchor="middle">Kubernetes</text>
      <rect x="430" y="286" width="72" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="466" y="308" text-anchor="middle">AWS</text>
      <rect x="514" y="286" width="116" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="572" y="308" text-anchor="middle">PostgreSQL</text>
    </g>
  </g>

  <g transform="translate(960 210)">
    <circle r="150" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5"/>
    <circle r="105" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>
    <circle r="60" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
    <circle r="14" fill="#ffffff" fill-opacity="0.9"/>
    <circle r="26" fill="#ffffff" fill-opacity="0.12"/>
    <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/>
      <circle cx="150" cy="0" r="9" fill="#22d3ee"/>
      <circle cx="150" cy="0" r="18" fill="#22d3ee" fill-opacity="0.25"/>
    </g>
    <g><animateTransform attributeName="transform" type="rotate" from="120" to="480" dur="15s" repeatCount="indefinite"/>
      <circle cx="105" cy="0" r="8" fill="#a78bfa"/>
      <circle cx="105" cy="0" r="16" fill="#a78bfa" fill-opacity="0.25"/>
    </g>
    <g><animateTransform attributeName="transform" type="rotate" from="240" to="-120" dur="9s" repeatCount="indefinite"/>
      <circle cx="60" cy="0" r="7" fill="#fb7185"/>
      <circle cx="60" cy="0" r="14" fill="#fb7185" fill-opacity="0.25"/>
    </g>
  </g>
</svg>
